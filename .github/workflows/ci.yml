name: CI Pipeline

# Пайплайн запускається при пуші в main та при створенні Pull Request
on:
  push:
    branches: [ "main", "Lab-5" ]
  pull_request:
    branches: [ "main", "Lab-5" ]

jobs:
  # Етап 1: Перевірка якості та безпеки (Quality & Security Stage)
  quality_and_security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Сканування Dockerfile на Best Practices за допомогою Hadolint
      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/api/Dockerfile
          failure-threshold: error

      - name: Lint Web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: src/web/Dockerfile
          failure-threshold: error

      # Сканування коду на вразливості (SCA) за допомогою Trivy
      - name: Scan API dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'src/api'
          format: 'table'
          exit-code: '1' # Пайплайн впаде, якщо знайдено критичні вразливості
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # Етап 2: Збірка та публікація Docker-образів (Build & Package Stage)
  build_and_publish:
    # Запускається тільки якщо попередній Job пройшов успішно і це пуш в main
    needs: quality_and_security
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Lab-5')
    runs-on: ubuntu-latest
    
    # Надаємо права запису для GitHub Token (щоб пушити в реєстр)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Витягуємо короткий хеш коміту для версіонування (GIT_SHA)
      - name: Get short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
        
      # Збірка та публікація API
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./src/api
          push: true
          # Використовуємо тегування хешем коміту (immutable tags)
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/shopping-list-api:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ env.REPO_OWNER }}/shopping-list-api:latest
      # Збірка та публікація Web
      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: ./src/web
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/shopping-list-web:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ env.REPO_OWNER }}/shopping-list-web:latest

deploy:
    name: Безперервне розгортання в Azure
    # Цей етап запуститься ТІЛЬКИ після успішного завершення етапу збірки (наприклад, 'build_and_push')
    needs: build_and_publish # ЗАМІНІТЬ 'quality_and_security' на назву вашого попереднього Job'а зі збірки!
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Lab-5')
    runs-on: ubuntu-latest
    
    steps:
      - name: Виконання деплою через SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Переходимо в директорію проєкту
            cd /opt/shopping-list
            
            # Оновлюємо код із гілки Lab-5 (або main)
            sudo git fetch origin
            sudo git checkout ${{ github.ref_name }}
            sudo git pull origin ${{ github.ref_name }}
            
            # Оновлюємо образи з GitHub Container Registry (ghcr.io)
            # Якщо ваші образи приватні, тут потрібен 'docker login', але ми поки вважаємо їх публічними
            sudo docker compose pull
            
            # Перезапускаємо контейнери з новими образами
            sudo docker compose up -d
            
      - name: Smoke Test (Перевірка доступності сайту)
        run: |
          # Чекаємо 10 секунд, щоб сервіси встигли піднятися
          sleep 10
          
          # Робимо HTTP GET запит до сайту і перевіряємо статус код (має бути 200)
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://${{ secrets.SERVER_HOST }}:8080)
          
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Smoke Test пройдено! Сервіс відповідає HTTP 200."
          else
            echo "Smoke Test провалено! Отримано HTTP статус $HTTP_STATUS."
            exit 1
          fi