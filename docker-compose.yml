version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: shopping_list
    volumes:
      # Постійне сховище для БД (щоб дані не зникли після рестарту)
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      # Перевіряємо, чи БД дійсно готова приймати з'єднання
      test: ["CMD-SHELL", "pg_isready -U shop_user -d shopping_list"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./src/api
    ports:
      - "3000:3000"
    environment:
      # Зв'язуємо з сервісом db за його іменем у compose
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=shop_user
      - DB_PASS=secret_password
      - DB_NAME=shopping_list
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        # API запуститься ТІЛЬКИ після успішного healthcheck бази даних
        condition: service_healthy

  web:
    build:
      context: ./src/web
    ports:
      - "8080:8080"
    networks:
      - frontend-net
    depends_on:
      - api
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000" 
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль для входу в Графану
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true # База даних ізольована від зовнішньої мережі (Security)

volumes:
  pgdata: